name: Recipe site checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo
          coverage: none
      - name: Check PHP syntax
        run: for file in *.php api/*.php tests/*.php; do php -l "$file" || exit 1; done
      - name: Render pages with disposable recipes
        run: python3 tests/render.py
      - name: Validate imports and API access
        run: python3 tests/import.py
      - name: Check JavaScript syntax
        run: node --check script.js
